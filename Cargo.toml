[workspace]
resolver = "2"
members = ["crates/timelake-format", "crates/timelake", "crates/timelake-cli", "spikes/iceberg-write"]
exclude = ["crates/timelake-py", "crates/timelake-wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/olekslitus/timelake"
publish = false

[workspace.dependencies]
# iceberg 0.10.1 is on Arrow 58, so DataFusion 54.x (Arrow 58, object_store 0.13) is the newest matching engine.
iceberg = "=0.10.1"
datafusion = "54.1"
arrow = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["async", "object_store"] }
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure", "http"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"
typetag = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
rand = "0.9"
tracing = "0.1"

[profile.release]
debug = "line-tables-only"
