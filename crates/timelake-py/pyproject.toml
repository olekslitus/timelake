[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "timelake"
version = "0.0.1"
description = "Serverless time-series lake on Apache Iceberg"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyarrow>=14"]

[project.urls]
Homepage = "https://timelake.dev"
Documentation = "https://timelake.dev/docs/python"
Repository = "https://github.com/polythings/timelake"

[tool.maturin]
python-source = "python"
module-name = "timelake._timelake"
