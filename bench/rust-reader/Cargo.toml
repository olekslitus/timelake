[package]
name = "bench-reader"
version = "0.0.0"
edition = "2024"
publish = false

# Separate workspace: Vortex 0.88 needs DataFusion 55 / Arrow 59, while the iceberg spike is on Arrow 58.
[workspace]

[dependencies]
vortex = { version = "=0.88.0", features = ["tokio"] }
vortex-datafusion = "=0.88.0"
datafusion = "55"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
url = "2"
object_store = { version = "0.13", features = ["aws"] }

[profile.release]
debug = false
