[project]
name = "timelake-bench"
version = "0.0.0"
description = "Benchmarks for Timelake (SPEC.md §17)"
requires-python = ">=3.12"
dependencies = [
    "timelake",
    "duckdb>=1.5",
    "datafusion>=54",
    "polars>=1.30",
    "pyarrow>=20",
    "numpy>=2",
    "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]>=0.10",
    "pytz",                                    # DuckDB needs it to return timestamptz values to Python
    "pylance>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "boto3>=1.43.112",
    "botocore[crt]>=1.43.112",
]

# The scripts stay plain files (python run.py, python v0/ingest.py, ...); the code they share is the
# `benchlib` package next to them, installed editable by `uv sync`.
[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "benchlib"
module-root = ""

[tool.uv.sources]
timelake = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["v0"]                        # the tests import the v0 scripts as modules
