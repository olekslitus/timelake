[project]
name = "timelake-bench"
version = "0.0.0"
description = "Benchmarks for Timelake (SPEC.md §17)"
requires-python = ">=3.12"
dependencies = [
    "timelake",
    "duckdb",
    "datafusion",
    "polars",
    "pyarrow",
    "numpy",
    "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]",
    "pytz",
    "pylance>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "boto3>=1.43.112",
    "botocore[crt]>=1.43.112",
]

[tool.uv]
package = false

[tool.uv.sources]
timelake = { workspace = true }
